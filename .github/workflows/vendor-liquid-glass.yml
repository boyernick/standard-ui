name: Vendor LiquidGlass

on:
  push:
    branches:
      - feat/liquid-glass-material

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/liquid-glass-material

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Vendor LiquidGlass 1.0.3
        run: |
          mkdir -p packages/react/src/lib/liquidglass
          curl -fsSL https://cdn.jsdelivr.net/npm/@ybouane/liquidglass@1.0.3/dist/index.js -o packages/react/src/lib/liquidglass/index.js
          curl -fsSL https://raw.githubusercontent.com/ybouane/liquidglass/main/LICENSE -o packages/react/src/lib/liquidglass/LICENSE
          cat > packages/react/src/lib/liquidglass/NOTICE.md <<'EOF'
          # LiquidGlass

          Vendored from `@ybouane/liquidglass@1.0.3`.

          Source: https://github.com/ybouane/liquidglass
          License: MIT. See `LICENSE`.

          `index.js` is the package's published bundled WebGL renderer. StandardUI
          vendors the build because version 1.0.3 publishes a `postinstall`
          command whose `patch-package` executable is not a runtime dependency.
          EOF

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit vendored renderer and lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/react/src/lib/liquidglass/index.js packages/react/src/lib/liquidglass/LICENSE packages/react/src/lib/liquidglass/NOTICE.md package-lock.json
          git commit -m "Vendor LiquidGlass renderer"
          git push origin HEAD:feat/liquid-glass-material
